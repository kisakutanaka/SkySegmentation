<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空だけを分離して怪獣を合成するサンプル</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; text-align: center; }
  #stage { position: relative; width: 100%; max-width: 640px; }
  #view { width: 100%; display: block; border-radius: 8px; background: #000; }
  #stats {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0, 0, 0, .55); padding: 4px 8px; border-radius: 6px;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  button {
    font-size: 16px; padding: 10px 20px; border-radius: 8px;
    border: 0; background: #4c8dff; color: #fff; cursor: pointer;
  }
  button:disabled { background: #444; cursor: default; }
  #status { font-size: 13px; color: #aaa; min-height: 1.4em; text-align: center; margin: 0; }
  #debugbar { font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<h1>空だけを分離して怪獣を合成するサンプル</h1>

<button id="start">カメラを開始</button>
<p id="status">「カメラを開始」を押すと、モデル（約200KB）を読み込みます。</p>

<label id="debugbar"><input type="checkbox" id="debug"> 空領域を塗りつぶして表示（デバッグ）</label>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="stats" hidden></div>
</div>

<video id="camera" playsinline muted autoplay hidden></video>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.min.js"></script>
<script type="module" src="./app.js"></script>

</body>
</html>
